[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "QuantAgent"
version = "1.0.0"
authors = [
    { name = "Teriyake4" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic==0.104.1",
    "Flask==3.1.3",
    "ipython==9.13.0",
    "langchain==1.3.1",
    "langchain-anthropic==1.4.3",
    "langchain-core==1.4.0",
    "langchain-openai==1.2.2",
    "langchain-qwq==0.3.5",
    "langgraph==1.2.1",
    "matplotlib==3.10.9",
    "mplfinance==0.12.10b0",
    "numpy==2.4.6",
    "openai==2.38.0",
    "pandas==3.0.3",
    "pillow==12.2.0",
    "requests==2.34.2",
    "TA-Lib==0.6.8",
    "yfinance==1.4.0"
]

[tool.setuptools]
py-modules = [
    "agent_state",
    "color_style",
    "decision_agent",
    "default_config",
    "graph_setup",
    "graph_util",
    "indicator_agent",
    "pattern_agent",
    "static_util",
    "trading_graph",
    "trend_agent",
    "web_interface"
]
